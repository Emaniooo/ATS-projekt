<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel</title>
  <link rel="stylesheet" href="styles.css">
  <script src="supabase.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
<nav class="navbar">
  <div class="nav-left">
    <a href="home.html" class="nav-logo">Mini‑ATS</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="admin.html" id="admin-link" class="active">Admin</a>
  </div>

  <div class="nav-right">
    <!-- Profil-ikon (visas bara när man är inloggad) -->
    <div id="profile-icon-container" class="profile-icon-container" style="display:none;">
      <img src="user.png" class="profile-icon" id="profile-icon">

      <div id="profile-dropdown" class="profile-dropdown">
        <p><strong id="dd-name"></strong></p>
        <p id="dd-email"></p>
        <button id="logout-btn">Logga ut</button>
      </div>
    </div>

    <!-- Logga in-knapp (visas när man är utloggad) -->
    <a href="index.html" id="auth-button">Logga in</a>
  </div>
</nav>


<div class="page-container">
<h1 class="page-title">Admin Panel</h1>

<div class="admin-grid">

  <section class="admin-section">
    <h2>Skapa kund</h2>
    <form id="create-customer-form" class="form-card">
      <input type="text" id="customer-name" placeholder="Kundnamn" required>
      <button type="submit">Skapa kund</button>
    </form>
  </section>

  <section class="admin-section">
    <h2>Skapa användare</h2>
    <form id="create-user-form" class="form-card">
      <input type="email" id="new-user-email" placeholder="Email" required>
      <input type="password" id="new-user-password" placeholder="Lösenord" required>
      <button type="submit">Skapa användare</button>
    </form>
  </section>

</div>
</div>
</body>
<footer>
  <p>© 2026 Mini‑ATS — Built by Eman</p>
</footer>

</html>
